<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icons/icon.svg">
    <title>Reloj</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <main class="relog-contenedor">
        <section class="cont contenedor-1">
            <p><span id="horas"></span><span class="double">:</span></p>
            <span id="minutos"></span>
        </section>
        <section class="cont contenedor-2">
            <p><span class="double">:</span><span id="segundos"></span></p>
        </section>
    </main>


    <script src="a.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch((error) => {
                    console.error('Service worker registration failed:', error);
                });
            });
        }
    </script>
</body>

</html>
